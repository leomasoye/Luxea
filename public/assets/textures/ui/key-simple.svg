<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" width="28" height="28">
  <!-- Retro Simple Dungeon Key -->
  <!-- Outer Outline -->
  <rect x="3" y="2" width="5" height="1" fill="#000000"/>
  <rect x="2" y="3" width="1" height="5" fill="#000000"/>
  <rect x="8" y="3" width="1" height="4" fill="#000000"/>
  <rect x="3" y="8" width="4" height="1" fill="#000000"/>
  <rect x="4" y="4" width="3" height="3" fill="#000000"/>

  <!-- Key Handle Fill (Gold/Brass) -->
  <rect x="3" y="3" width="5" height="1" fill="#ffe066"/>
  <rect x="3" y="4" width="1" height="3" fill="#ffe066"/>
  <rect x="7" y="4" width="1" height="3" fill="#d4af37"/>
  <rect x="3" y="7" width="5" height="1" fill="#aa820a"/>

  <!-- Key Stem / Shaft -->
  <rect x="6" y="7" width="3" height="1" fill="#000000"/>
  <rect x="6" y="8" width="1" height="6" fill="#000000"/>
  <rect x="9" y="8" width="1" height="6" fill="#000000"/>
  <rect x="7" y="8" width="2" height="6" fill="#ffe066"/>
  <rect x="8" y="9" width="1" height="5" fill="#d4af37"/>
  <rect x="6" y="14" width="4" height="1" fill="#000000"/>

  <!-- Key Teeth / Bit -->
  <rect x="10" y="10" width="3" height="1" fill="#000000"/>
  <rect x="10" y="11" width="2" height="1" fill="#ffe066"/>
  <rect x="12" y="11" width="1" height="1" fill="#000000"/>
  <rect x="10" y="12" width="2" height="1" fill="#000000"/>

  <rect x="10" y="13" width="4" height="1" fill="#000000"/>
  <rect x="10" y="14" width="3" height="1" fill="#ffe066"/>
  <rect x="13" y="14" width="1" height="1" fill="#000000"/>
  <rect x="9" y="15" width="5" height="1" fill="#000000"/>
</svg>