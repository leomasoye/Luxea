<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Luxea — Concours Games on Web 2027</title>
  <style>
    @font-face {
      font-family: 'Triforce';
      src: url('/assets/fonts/Triforce-y07d.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0e14;
      font-family: 'Courier New', 'Lucida Console', monospace, sans-serif;
      color: #f0f4f8;
    }

    #renderCanvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      touch-action: none;
      image-rendering: pixelated;
    }

    /* UI Overlay Layer */
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      z-index: 10;
    }

    .interactive {
      pointer-events: auto;
    }

    /* HUD Bar */
    #hud {
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      padding: 16px 20px;
      gap: 18px;
    }

    .hud-status-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Health Hearts */
    .hearts-container {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .heart-icon {
      width: 32px;
      height: 28px;
      background-image: url('/assets/textures/ui/heart-full.svg');
      background-size: contain;
      background-repeat: no-repeat;
      image-rendering: pixelated;
      display: inline-block;
      filter: drop-shadow(2px 2px 0px #000);
      transition: transform 0.1s ease;
    }

    .heart-icon.half {
      background-image: url('/assets/textures/ui/heart-half.svg');
    }

    .heart-icon.empty {
      background-image: url('/assets/textures/ui/heart-empty.svg');
    }

    /* Retro Light Gauge (No text label, pixel lantern icon) */
    .retro-gauge-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .gauge-icon {
      width: 24px;
      height: 24px;
      background-size: contain;
      background-repeat: no-repeat;
      image-rendering: pixelated;
      filter: drop-shadow(1px 1px 0px #000);
      flex-shrink: 0;
    }

    .lantern-icon {
      background-image: url('/assets/textures/ui/item-lantern.svg');
    }

    .retro-bar-frame {
      width: 136px;
      height: 14px;
      background: #080c14;
      border: 3px solid #000;
      box-shadow: inset 1px 1px 0 #555, inset -1px -1px 0 #222, 2px 2px 0px #000;
      position: relative;
      overflow: hidden;
    }

    .light-bar-fill {
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(90deg, #ffe066 0px, #ffe066 7px, #e5a800 7px, #e5a800 8px);
      box-shadow: inset 0 2px 0 #fffbe0, inset 0 -2px 0 #8c6000;
      transition: width 0.08s linear;
    }

    /* Retro Items Container (Near Hearts, no background, no contour, no text) */
    .items-container {
      display: flex;
      gap: 12px;
      align-items: center;
      padding-top: 2px;
    }

    .item-icon {
      width: 28px;
      height: 28px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      image-rendering: pixelated;
      filter: drop-shadow(2px 2px 0px #000);
      opacity: 0.2;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }

    .item-icon.acquired {
      opacity: 1;
      filter: drop-shadow(2px 2px 0px #000);
      transform: scale(1.08);
    }

    .key-simple-icon {
      background-image: url('/assets/textures/ui/key-simple.svg');
    }

    .key-boss-icon {
      background-image: url('/assets/textures/ui/key-boss.svg');
    }

    .map-icon {
      background-image: url('/assets/textures/ui/item-map.svg');
    }

    .arrow-icon {
      background-image: url('/assets/textures/ui/item-arrow.svg');
    }

    /* Floating Projected Interaction Prompt */
    #interaction-prompt {
      position: absolute;
      transform: translate(-50%, -100%);
      background: #080d17;
      border: 3px solid #f0b429;
      outline: 2px solid #000;
      color: #ffe066;
      padding: 5px 12px;
      font-family: 'Triforce', monospace;
      font-size: 14px;
      letter-spacing: 1px;
      pointer-events: none;
      display: none;
      box-shadow: 4px 4px 0px #000;
      white-space: nowrap;
      text-shadow: 2px 2px 0px #000;
    }

    /* Dialogue & Message Box - 16-Bit Retro RPG Frame */
    #dialogue-container {
      width: 100%;
      padding: 0 24px 24px 24px;
      display: none;
    }

    .dialogue-box {
      max-width: 760px;
      margin: 0 auto;
      background: #0a0f1a;
      border: 4px solid #f0b429;
      outline: 3px solid #000000;
      box-shadow: inset 3px 3px 0 #ffe066, inset -3px -3px 0 #7a5814, 6px 6px 0px #000000;
      border-radius: 0px;
      padding: 16px 22px;
      color: #f7fafc;
      position: relative;
    }

    .dialogue-speaker {
      font-family: 'Triforce', monospace;
      color: #ffe066;
      font-size: 16px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-shadow: 2px 2px 0 #000;
    }

    .dialogue-text {
      font-size: 15px;
      line-height: 1.6;
      min-height: 44px;
      text-shadow: 1px 1px 0 #000;
    }

    .dialogue-hint {
      position: absolute;
      right: 18px;
      bottom: 10px;
      font-family: 'Triforce', monospace;
      font-size: 12px;
      letter-spacing: 1px;
      color: #ffe066;
      text-shadow: 1px 1px 0 #000;
    }

    .dialogue-arrow {
      display: inline-block;
      animation: retro-blink 0.8s infinite steps(1);
    }

    @keyframes retro-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* Modals & Fullscreen Overlays (Title, Pause, GameOver) - Authentic Retro */
    .menu-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(4, 6, 12, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      text-align: center;
    }

    /* Retro Pixel Window Frame */
    .modal-card {
      background: #0c121d;
      border: 4px solid #f0b429;
      outline: 3px solid #000000;
      box-shadow: inset 3px 3px 0 #ffe066, inset -3px -3px 0 #7a5814, 8px 8px 0px #000000;
      border-radius: 0px;
      padding: 30px 36px;
      max-width: 500px;
      width: 90%;
    }

    .game-title {
      font-family: 'Triforce', monospace;
      font-size: 46px;
      letter-spacing: 4px;
      color: #ffe066;
      text-shadow: 4px 4px 0 #000000, 2px 2px 0 #b38600;
      margin-bottom: 22px;
    }

    /* Retro Buttons with Cursor and Pixel 3D Bevel */
    .btn-retro {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: #1a365d;
      border: 3px solid;
      border-color: #63b3ed #0d1e33 #0d1e33 #63b3ed;
      color: #ffffff;
      padding: 12px 18px;
      font-family: 'Triforce', monospace;
      font-size: 17px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 0px;
      margin-bottom: 12px;
      box-shadow: 3px 3px 0px #000000;
      transition: none;
    }

    .btn-retro .cursor-arrow {
      color: #ffe066;
      font-size: 14px;
      opacity: 0;
      transform: translateX(-4px);
    }

    .btn-retro:hover {
      background: #2b6cb0;
      border-color: #bee3f8 #1a365d #1a365d #bee3f8;
      color: #ffe066;
    }

    .btn-retro:hover .cursor-arrow {
      opacity: 1;
      transform: translateX(0);
    }

    .btn-retro:active {
      border-color: #0d1e33 #63b3ed #63b3ed #0d1e33;
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #000000;
    }

    .btn-secondary {
      background: #1a202c;
      border-color: #4a5568 #0a0d14 #0a0d14 #4a5568;
      color: #cbd5e0;
    }

    .btn-secondary:hover {
      background: #2d3748;
      border-color: #718096 #1a202c #1a202c #718096;
      color: #fff;
    }

    /* Controls Panel - Retro Window Style */
    .controls-panel {
      margin-top: 18px;
      background: #080d17;
      border: 2px solid #000;
      box-shadow: inset 1px 1px 0 #334460, inset -1px -1px 0 #04060a;
      border-radius: 0px;
      padding: 12px 16px;
      font-size: 12px;
      text-align: left;
      line-height: 1.8;
      color: #cbd5e0;
    }

    .controls-panel strong {
      color: #ffe066;
      font-family: 'Triforce', monospace;
      letter-spacing: 1px;
    }

    .key-badge {
      display: inline-block;
      background: #1a202c;
      border: 1px solid #4a5568;
      padding: 1px 6px;
      border-radius: 0px;
      box-shadow: 1px 1px 0 #000;
      font-weight: bold;
      color: #fff;
    }

    /* Dev stats */
    #dev-stats {
      position: absolute;
      bottom: 8px;
      left: 10px;
      font-size: 10px;
      color: #627d98;
      pointer-events: none;
      font-family: monospace;
      z-index: 20;
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <div id="ui-overlay">
    <!-- Top HUD -->
    <div id="hud">
      <div class="hud-status-col">
        <div class="hearts-container" id="hearts-container">
          <div class="heart-icon" id="heart-0"></div>
          <div class="heart-icon" id="heart-1"></div>
          <div class="heart-icon" id="heart-2"></div>
        </div>
        <div class="retro-gauge-container">
          <div class="gauge-icon lantern-icon" title="Énergie de Lumière"></div>
          <div class="retro-bar-frame">
            <div class="light-bar-fill" id="light-bar-fill"></div>
          </div>
        </div>
      </div>

      <!-- Retro Items (Near hearts, no contour, no text) -->
      <div class="items-container" id="items-container">
        <div class="item-icon key-simple-icon" id="icon-simple-key" title="Clé"></div>
        <div class="item-icon key-boss-icon" id="icon-boss-key" title="Clé de Boss"></div>
        <div class="item-icon map-icon" id="icon-map" title="Carte"></div>
        <div class="item-icon arrow-icon" id="icon-arrows" title="Flèches"></div>
      </div>
    </div>

    <!-- Projected 3D Floating Interaction Prompt -->
    <div id="interaction-prompt"></div>

    <!-- Dialogue Box -->
    <div id="dialogue-container" class="interactive">
      <div class="dialogue-box">
        <div class="dialogue-speaker" id="dialogue-speaker">Zelya</div>
        <div class="dialogue-text" id="dialogue-text">...</div>
        <div class="dialogue-hint">[E] ou [Espace] <span class="dialogue-arrow">▼</span></div>
      </div>
    </div>
  </div>

  <!-- Title Screen Modal -->
  <div id="title-screen" class="menu-modal interactive">
    <div class="modal-card">
      <div class="game-title">LUXEA</div>

      <button id="btn-start-game" class="btn-retro">
        <span class="cursor-arrow">►</span> Commencer l'aventure
      </button>
      <button id="btn-sound-toggle" class="btn-retro btn-secondary" style="display: none;">
        <span class="cursor-arrow">►</span> Son : Désactivé
      </button>

      <div class="controls-panel">
        <div><strong>DÉPLACEMENT :</strong> <span class="key-badge">ZQSD</span> / <span class="key-badge">WASD</span> / <span class="key-badge">Flèches</span></div>
        <div><strong>ATTAQUE :</strong> <span class="key-badge">Espace</span> ou <span class="key-badge">Clic G</span></div>
        <div><strong>LUMIÈRE :</strong> Maintenir <span class="key-badge">Shift</span> ou <span class="key-badge">Clic D</span></div>
        <div><strong>ROULADE :</strong> <span class="key-badge">K</span></div>
        <div><strong>INTERAGIR :</strong> <span class="key-badge">E</span></div>
        <div><strong>PAUSE :</strong> <span class="key-badge">Échap</span> ou <span class="key-badge">P</span></div>
      </div>
    </div>
  </div>

  <!-- Pause Menu Modal -->
  <div id="pause-modal" class="menu-modal interactive" style="display: none;">
    <div class="modal-card">
      <div class="game-title" style="font-size: 36px; margin-bottom: 24px;">PAUSE</div>

      <button id="btn-resume-game" class="btn-retro">
        <span class="cursor-arrow">►</span> Reprendre
      </button>
      <button id="btn-pause-sound" class="btn-retro btn-secondary" style="display: none;">
        <span class="cursor-arrow">►</span> Son : Désactivé
      </button>
      <button id="btn-reset-game" class="btn-retro btn-secondary">
        <span class="cursor-arrow">►</span> Recommencer au Spawn
      </button>
    </div>
  </div>

  <!-- Game Over Modal -->
  <div id="gameover-modal" class="menu-modal interactive" style="display: none;">
    <div class="modal-card" style="border-color: #e61c38; box-shadow: inset 3px 3px 0 #ff6b81, inset -3px -3px 0 #800016, 8px 8px 0px #000;">
      <div class="game-title" style="font-size: 36px; color: #ff4d6d; text-shadow: 4px 4px 0 #000, 2px 2px 0 #80001a; margin-bottom: 24px;">DÉFAITE</div>
      <button id="btn-respawn" class="btn-retro">
        <span class="cursor-arrow">►</span> Réapparaître dans la Plaine
      </button>
    </div>
  </div>

  <div id="dev-stats">60 FPS</div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
